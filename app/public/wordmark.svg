  <path d="M8 57 V22 a10.5 10.5 0 0 1 21 0 V57 Z" fill="none" stroke="#8A7A5E" stroke-opacity="0.55" stroke-width="1"/>

  <g clip-path="url(#wmSlab)" stroke-linecap="round">
    <g stroke="#FFFFFF" stroke-opacity="0.55" transform="translate(0 0.95)">
      <line x1="13" y1="29" x2="24" y2="29" stroke-width="1.9"/>
