  <!-- Untuk pemakaian di web, fonta serif proyek sudah dimuat halaman sehingga
       teks ini tampil sebagaimana mestinya. Untuk cetak atau kiriman ke pihak
       luar, ubah dulu jadi kurva agar tidak bergantung pada fonta terpasang. -->
  <text x="46" y="47" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif"
