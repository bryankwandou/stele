<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-labelledby="steleWordmarkTitle">
  <title id="steleWordmarkTitle">Stele</title>

  <defs>
    <linearGradient id="wmStone" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#F2ECDF"/>
      <stop offset="0.52" stop-color="#DFD3BC"/>
      <stop offset="1"    stop-color="#C2B49A"/>
    </linearGradient>
    <linearGradient id="wmEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#4A3F2C" stop-opacity="0.20"/>
    </linearGradient>
    <clipPath id="wmSlab">
