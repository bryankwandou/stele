      <line x1="13" y1="42" x2="24" y2="42" stroke-width="1.9"/>
      <line x1="13" y1="48.5" x2="19.5" y2="48.5" stroke-width="1.9"/>
    </g>
    <g stroke="#6B5C42" stroke-opacity="0.78">
